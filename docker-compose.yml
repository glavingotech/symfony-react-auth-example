services:
  app:
    build: ./front
    ports:
      - 5173:5173
    volumes:
      - ./front:/app

  php:
    build: ./back
    command: sh -c "composer install && symfony serve --listen-ip=0.0.0.0 --no-tls"
    ports:
      - 8000:8000
    depends_on:
      - db
    volumes:
      - ./back:/var/www/html

  db:
    image: mariadb:10.6
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_USER=${MYSQL_USER_NAME}
      - MYSQL_PASSWORD=${MYSQL_USER_PASSWORD}
    ports:
      - 3506:3306
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin
    ports:
      - 9988:80
    environment:
      - PMA_HOST=${PMA_HOST}
      - PMA_USER=${MYSQL_USER_NAME}
      - PMA_PASSWORD=${MYSQL_USER_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    depends_on:
      - db

volumes:
  db_data:
